<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BubbleTasks</title>
    <link rel="icon" type="image/png" href="assets/icon128.png" />
    <link rel="stylesheet" href="styles.css?v=white-story-task-icons-1" />
  </head>
  <body>
    <div id="app">
      <aside class="sidebar panel">
        <section class="card" id="dateTimeCard"></section>
        <section class="card" id="agendaCard"></section>
        <section class="card" id="feedCard"></section>
        <section class="card" id="completionCard"></section>
      </aside>

      <main class="main panel">
        <header class="card controls">
          <div class="title-row">
            <h1>BubbleTasks</h1>
            <div class="accent-stars" aria-hidden="true">
              <img src="assets/singlestar3.gif" alt="" class="tiny-star tiny-star-lg" />
              <img src="assets/singlestar3.gif" alt="" class="tiny-star" />
              <img src="assets/singlestar3.gif" alt="" class="tiny-star tiny-star-sm" />
            </div>
          </div>
          <div class="task-form">
            <input id="taskTitleInput" aria-label="Task title" placeholder="Task title" />
            <select id="taskCategoryInput" aria-label="Category"></select>
            <select id="taskStoryInput" aria-label="Story" hidden></select>
            <input id="taskDueDateInput" aria-label="Due date" type="date" />
            <input id="taskPriorityInput" aria-label="Priority (1-5)" type="number" min="1" max="5" placeholder="Priority (1-5)" />
            <button id="addTaskButton">Add Task</button>
          </div>
          <div class="toolbar">
            <button id="layoutToggleButton">Switch Layout</button>
            <button id="backupTasksButton">Backup Tasks</button>
            <button id="loadBackupButton">Load Backup</button>
            <button id="openArchiveButton">Archive</button>
            <button id="openBoredButton">Bored List</button>
          </div>
        </header>

        <section id="boardContainer" class="board"></section>
      </main>
    </div>

    <div id="archiveModal" class="modal hidden" aria-hidden="true">
      <div class="modal-body">
        <h2>Archive</h2>
        <div id="archiveList"></div>
        <div class="modal-actions">
          <button id="clearArchiveButton">Delete All</button>
          <button id="resetInsightsButton">Reset Insights</button>
          <button id="closeArchiveButton">Close</button>
        </div>
      </div>
    </div>

    <div id="boredModal" class="modal hidden" aria-hidden="true">
      <div class="modal-body">
        <h2>Bored Tasks</h2>
        <div class="bored-form-row">
          <input id="boredInput" placeholder="Something quick to do" />
          <button id="addBoredButton">Add</button>
        </div>
        <div id="boredList"></div>
        <div class="modal-actions">
          <button id="closeBoredButton">Close</button>
        </div>
      </div>
    </div>

    <a class="floating-logo" href="https://github.com/ratioactivity" target="_blank" rel="noreferrer">
      <img src="assets/icon128.png" alt="BubbleTasks logo" />
    </a>
    <input id="backupFileInput" type="file" accept="application/json,.json" hidden />

    <dialog id="storyStatusDialog" aria-labelledby="storyStatusHeading">
      <form id="storyStatusForm">
        <h2 id="storyStatusHeading">Story status</h2>
        <label>Label (optional, shown in bold)
          <input name="statusLabel" maxlength="100" placeholder="e.g. Current Chapter:" />
        </label>
        <label>Status value
          <input name="statusValue" maxlength="300" placeholder="e.g. 16 or outlining the ending" />
        </label>
        <label>Hover note (optional, shown over the value)
          <textarea name="statusNote" maxlength="2000" rows="4" placeholder="Add a chapter description or extra context"></textarea>
        </label>
        <div class="modal-actions">
          <button type="button" id="cancelStoryStatus">Cancel</button>
          <button type="submit">Save status</button>
        </div>
      </form>
    </dialog>
    <script src="script.js?v=story-pins-status-1"></script>
    <script src="compact-task-controls.js?v=png-task-icons-1"></script>
    <dialog id="cardTaskDialog" aria-labelledby="cardTaskHeading">
      <form id="cardTaskForm">
        <h2 id="cardTaskHeading">Add task</h2>
        <label>Task title<input name="cardTitle" required autofocus /></label>
        <label>Due date (optional)<input name="cardDue" type="date" /></label>
        <label>Priority (1–5)<input name="cardPriority" type="number" min="1" max="5" /></label>
        <div class="modal-actions">
          <button type="button" id="cancelCardTask">Cancel</button>
          <button type="submit">Add task</button>
        </div>
      </form>
    </dialog>
    <script src="card-task-controls.js?v=1"></script>
    <script src="story-note-position.js?v=1"></script>
  </body>
</html>
